<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generic Survey Form</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <h1 id="title">
      Simple Survey Form
    </h1>
    <p id="description">
      The best Idea, is the one that applied on
    </p>

    <form id="survey-form">
      <fieldset>
        <legend>
          <label for="name" id="name-label">Name</label>
        </legend>
        <input id="name" type="text" placeholder="Enter your name" required>
      </fieldset>
      <fieldset>
        <legend>
          <label for="email" id="email-label">Email</label>
        </legend>
        <input id="email" type="email" placeholder="Enter your Email" required>
      </fieldset>
      <fieldset>
        <legend>
          <label for="email" id="number-label">Age (optional)</label>
        </legend>
        <input id="number" type="number" min="10" max="80" placeholder="Age">
      </fieldset>
      <fieldset>
        <legend>
          Which option describe your current role?
        </legend>
        <select id="dropdown">
          <option selected>
            Select current role
          </option>
          <option>
            Student
          </option>
          <option>
            Full Time Job
          </option>
        </select>
      </fieldset>
      <fieldset>
        <legend>
          Would you recommend freeCodeCamp to a friend?
        </legend>
        <label for="choice1"><input type="radio" name="choice" id="choice1" value="definitely"> Definitely</label>
        <label for="choice2"><input type="radio" name="choice" id="choice2" value="maybe"> Maybe</label>
        <label for="choice3"><input type="radio" name="choice" id="choice3" value="not sure"> Not sure</label>
      </fieldset>
      <fieldset>
        <legend>
          What would you like to see improved?
        </legend>
        <label>
          <input type="checkbox" value="1">
          Front-end Projects
        </label>
        <label>
          <input type="checkbox" value="2">
          Back-end Projects
        </label>
        <label>
          <input type="checkbox" value="3">
          Data Visualization
        </label>
      </fieldset>
      <fieldset>
        <legend>
          Any comments or suggestions?
        </legend>
        <textarea rows="5" cols="30" placeholder="Enter your comment here....">
        </textarea>
      </fieldset>
      <fieldset>
        <input type="submit" id="submit">
      </fieldset>
    </form>
  </body>
</html>
